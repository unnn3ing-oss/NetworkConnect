name: Release

# 發布新版（App 內「檢查更新」從 GitHub Releases 下載）。
# 只在手動觸發時執行：使用者確認這一版沒有要再修改後，才到 GitHub 網頁 Actions → Release → Run workflow（或請 Claude 代為觸發）。
# 流程：三平台測試 → 打包（版本號＝package.json 的 major.minor ＋ 本 workflow 的執行次數，例如 0.1.3）→ 建立並發布 Release。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      build-number: ${{ format('{0}', github.run_number) }}

  release:
    name: release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: NetworkConnect-*
          path: artifacts
          merge-multiple: true
      - name: 建立並發布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").$RUN_NUMBER"
          ls -l artifacts
          ls artifacts | grep -q -- "-$version-mac-arm64.dmg$"
          ls artifacts | grep -q -- "-$version-win-x64.exe$"
          # 更新內容：上一個 v* tag 之後的 commit 標題（App 的更新對話框會顯示）
          prev="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          { echo "更新內容："; git log --no-merges --format='- %s' ${prev:+"$prev"..}HEAD | head -n 30; } > notes.md
          cat notes.md
          gh release create "v$version" artifacts/* --target "$GITHUB_SHA" --title "NetworkConnect $version" --notes-file notes.md --latest

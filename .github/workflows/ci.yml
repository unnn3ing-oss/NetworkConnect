name: CI

# 任何分支 push 與 PR 都會執行：三平台跑單元／契約測試，並打包 Mac（Apple 晶片）與 Windows 安裝檔做 Electron 冒煙測試。
# 這裡只上傳 workflow artifacts，不建立 Release（發布新版見 release.yml，只在手動觸發時執行）。
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # 單元測試不需要 Electron 本體，省下每個平台約 100 MB 的下載
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package
    needs: test
    uses: ./.github/workflows/package.yml
